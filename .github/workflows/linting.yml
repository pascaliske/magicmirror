# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Linting
on: push

permissions:
  contents: read
  pull-requests: read

jobs:
  lint-ansible:
    name: Ansible
    runs-on: ubuntu-latest
    steps:
      # checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # workaround: ensure git directory exists in working directory, ansible action requires this
      - name: Symlink Git directory to ansible working directory
        run: |
          ln -s ${{ github.workspace }}/.git ${{ github.workspace }}/ansible/.git
          ln -s ${{ github.workspace }}/.ansible-lint ${{ github.workspace }}/ansible/.ansible-lint

      # lint ansible
      - uses: ansible/ansible-lint@665d9e07a1943254d2910faffc106adaf7ea7294 # v26.8.0
        with:
          working_directory: ${{ github.workspace }}/ansible

  lint-dockerfile:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      # checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # lint dockerfile
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          failure-threshold: warning

  lint-angular:
    name: Angular
    runs-on: ubuntu-latest
    steps:
      # checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # lint angular
      - name: Lint
        run: |
          yarn install --frozen-lockfile --ignore-scripts
          yarn run lint

  lint-go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      # checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup go
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26

      # lint go
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          working-directory: api
